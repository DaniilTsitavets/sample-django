---
- name: Create etcd required directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/etcd, mode: '0755' }
    - { path: /var/lib/etcd, mode: '0700' }
  become: yes

- name: Copy required certs and key to /etc/etcd/
  ansible.builtin.copy:
    src: "{{ certificate_path }}/{{ item }}"
    dest: "/etc/etcd/{{ item }}"
    mode: '0644'
  loop:
    - ca.crt
    - kube-api-server.key
    - kube-api-server.crt
  become: yes
