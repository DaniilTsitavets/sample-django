---
- name: Create /etc/etcd
  ansible.builtin.file:
    path: /etc/etcd
    state: directory
    mode: '0755'

- name: Create /var/lib/etcd
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    mode: '0700'

- name: Copy CA to /etc/etcd/
  ansible.builtin.copy:
    src: "{{ certificate_path }}/ca.crt"
    dest: /etc/etcd/ca.crt
    mode: '0644'

- name: Copy kube-api-server.key to /etc/etcd/
  ansible.builtin.copy:
    src: "{{ certificate_path }}/kube-api-server.key"
    dest: /etc/etcd/kube-api-server.key
    mode: '0644'

- name: Copy kube-api-server.crt to /etc/etcd/
  ansible.builtin.copy:
    src: "{{ certificate_path }}/kube-api-server.crt"
    dest: /etc/etcd/kube-api-server.crt
    mode: '0644'
