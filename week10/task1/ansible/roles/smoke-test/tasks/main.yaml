---
- name: Wait for readiness of nodes
  community.kubernetes.k8s_info:
    kind: Node
  register: nodes_info
  until: nodes_info.resources | selectattr('status.conditions', 'defined') | selectattr(
    'status.conditions[-1].type', 'equalto', 'Ready') | selectattr('status.conditions[-1].status', 'equalto', 'True') | list | length == (groups['all'] | length)
  retries: 15
  delay: 10

- name: Create nginx deployment using k8s module
  community.kubernetes.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: nginx
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: nginx
        template:
          metadata:
            labels:
              app: nginx
          spec:
            containers:
              - name: nginx
                image: nginx:latest

- name: Wait until nginx pod is running
  community.kubernetes.k8s_info:
    kind: Pod
    label_selectors:
      - "app=nginx"
  register: nginx_pods
  until: nginx_pods.resources[0].status.phase == "Running"
  retries: 15
  delay: 10

- name: Get nginx pod name
  set_fact:
    pod_name: "{{ nginx_pods.resources[0].metadata.name }}"

- name: Get nginx pod logs
  ansible.builtin.command: "kubectl logs {{ pod_name }}"
  register: pod_logs

- name: Show nginx pod logs
  ansible.builtin.debug:
    msg: "{{ pod_logs.stdout }}"

- name: Exec nginx -v in pod
  ansible.builtin.command: "kubectl exec {{ pod_name }} -- nginx -v"
  register: exec_result

- name: Show exec result
  ansible.builtin.debug:
    msg: "{{ exec_result.stdout }}"

- name: Expose nginx deployment via NodePort
  community.kubernetes.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: nginx
      spec:
        type: NodePort
        selector:
          app: nginx
        ports:
          - protocol: TCP
            port: 80
            targetPort: 80

- name: Get nginx service info
  community.kubernetes.k8s_info:
    kind: Service
    name: nginx
  register: svc_info

- name: Set NodePort fact
  set_fact:
    node_port: "{{ svc_info.resources[0].spec.ports[0].nodePort }}"

- name: Try to curl nginx on each worker node
  ansible.builtin.command: "curl -I http://{{ item }}:{{ node_port }} -m 5"
  loop: "{{ groups['worker_nodes'] }}"
  register: curl_results

- name: Show curl result for each node
  ansible.builtin.debug:
    msg: "Node {{ item.item }}:\n{{ item.stdout }}"
  loop: "{{ curl_results.results }}"
